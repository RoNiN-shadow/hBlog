name: Deploy Haddock Docs and build the site

on:
  push:
    branches: [ "main" ]

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.0'

      - name: Cache Cabal dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Clean output folder
        run: rm -rf docs/

      - name: Build static Blog
        # Uses cabal
        run: cabal run blog -- convert-dir -i blogs/ -o docs/ -N "Mark's Blog"

      - name: Build Haddock Documentation
        # Using haddock-project builds everything and outputs cleanly into one directory
        run: cabal haddock-project --output-dir=docs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/' # This folder matches the output-dir above

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
